# PulseCharts production stack — fully self-hosted (app + Postgres + Redis on one host).
#
#   docker compose up -d --build
#
# Postgres and Redis run as containers here, so the database lives ON THIS HOST,
# next to the app — no external DB, no cross-region latency. Only the frontend
# (nginx) is exposed (port 80); the backend image runs in three roles (web, worker
# — which carries beat embedded via -B — and relay).
#
# Before first deploy, in backend/.env set:
#   DJANGO_DEBUG=False
#   DJANGO_SECRET_KEY=<a long random value>
#   DJANGO_ALLOWED_HOSTS=your-domain.com,your.server.ip
#   FRONTEND_URL=https://your-domain.com
#   OPENAI_API_KEY / TELEGRAM_* / SIGNAL_* as already configured
# And set a strong DB password (shell export or a .env file beside this one):
#   POSTGRES_PASSWORD=<a long random value>
#
# NOTE: backend/.env's DATABASE_URL is IGNORED here — compose points the app at
# the in-cluster `db` service. (To use an external DB instead, delete the `db`
# service + the DATABASE_URL line below and set DATABASE_URL in backend/.env.)
name: pulsecharts

# Shared env for the four backend roles. These override backend/.env (compose
# `environment` wins over env_file), pointing the app at the in-cluster services.
x-backend-env: &backend-env
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql://${POSTGRES_USER:-pulsecharts}:${POSTGRES_PASSWORD:-pulsecharts}@db:5432/${POSTGRES_DB:-pulsecharts}

# Container logs are unbounded by default — on a small host they quietly fill the
# disk until Postgres can't write. Cap every service at 30 MB of history.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL — data persists in the db-data volume across restarts/redeploys.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # Sized for a small (<2 GB) host. Postgres' defaults assume it owns the machine;
    # here it shares with 7 other containers, so trim the big allocations and tell the
    # planner the truth about how much OS cache it can expect. effective_cache_size is
    # a hint only — it allocates nothing.
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=96MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsecharts}
      POSTGRES_USER: ${POSTGRES_USER:-pulsecharts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsecharts}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Published to localhost only, so ./dev.sh (running on the host, outside
    # Docker) can use this same Postgres. Not exposed to the public interface.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsecharts}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Hard ceiling so a runaway Channels backlog can't OOM the host. volatile-lru (not
    # allkeys-lru) evicts ONLY keys carrying a TTL — Channels messages expire, group
    # memberships are refreshed, so this sheds backlog without silently dropping a
    # subscription and breaking a browser's live chart.
    # --save "" disables RDB snapshots: everything here is ephemeral (Channels groups +
    # the Celery queue, which beat refills within a minute), and a BGSAVE forks the
    # process — a transient RSS doubling this host can't absorb.
    command: redis-server --maxmemory 192mb --maxmemory-policy volatile-lru --save ""
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ASGI server: HTTP API + WebSocket relay. Runs migrations on start.
  web:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    env_file: ./backend/.env
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py sync_referral_code &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  # Celery worker: signal generation + outcome evaluation + alerts.
  worker:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    env_file: ./backend/.env
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    # -B embeds Celery BEAT in this worker instead of running it as a second container:
    # beat is only a clock, but a separate container costs a whole Django process
    # (~85 MB) this host can't spare. Celery calls embedded beat unsuitable for
    # production because only ONE beat may run and it dies with its worker — both moot
    # with exactly one worker, which is the shape of this deployment. If a second
    # worker is ever added, beat MUST be split back into its own service or every
    # scheduled task fires twice.
    # concurrency=1 is explicit rather than CPU-derived (this host has 1 vCPU, so it
    # was already the default); max-tasks-per-child recycles the child periodically so
    # slow allocation creep can't accumulate over days.
    command: celery -A config worker -B -l info --concurrency=1 --max-tasks-per-child=100

  # Hyperliquid relay: single upstream WS connection -> Channels groups.
  relay:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    env_file: ./backend/.env
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    command: python manage.py run_relay

  # nginx: serves the SPA and proxies /api, /ws, /admin, /static to web.
  # Not published directly — Caddy fronts it on 80/443 (reachable in-cluster).
  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      web:
        condition: service_started

  # Caddy: TLS termination + automatic HTTPS (Let's Encrypt) for SITE_DOMAIN.
  # Set SITE_DOMAIN in the repo-root .env (defaults to localhost for a self-
  # signed local cert). Point the domain's DNS A record at this host first.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      frontend:
        condition: service_started
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  db-data:
  caddy-data:
  caddy-config:
